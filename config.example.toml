[resolve]
# Optional guards. When set, commands warn if the open project/timeline differs.
project = ""
timeline = "DAZ_INPUT"

# 1-based Resolve audio track containing only the creator's voice.
# Resolve exposes no reliable way to detect which track this is: tracks in a typical
# project are all named "Audio N" and share the same source clip, differing only by
# channel mapping. This index is therefore required configuration.
voice_audio_track = 1

# 1-based video track that receives the zoom adjustment clips. `apply-preview` creates it on
# its preview timeline if it does not exist, and refuses to run if it exists and holds any
# clip at all: DAZ writes only to a dedicated, empty track and never overwrites anything.
zoom_video_track = 3

# 1-based video track whose cuts the planner may snap a reset to. This is the edited footage
# track, NOT the zoom track: the zoom track is DAZ's own output and has no cuts of its own.
# A "hard cut" here means one clip ends exactly where the next begins on this track; entering
# from black or running out into a gap is not a cut and is never snapped to.
cut_reference_video_track = 1

# Media Pool bin holding the user's prebuilt zoom assets.
asset_bin = "DAVINCI_AUTO_ZOOM"

# TRANSITION role -> Media Pool clip name.
#
# The keys are the allowed state changes of the visual state graph, not clip names and not
# levels:
#
#     X0       -> FACE_X1      x0_to_face_x1
#     FACE_X1  -> FACE_X2      face_x1_to_face_x2
#     FACE_X2  -> FACE_X3      face_x2_to_face_x3
#     FACE_X1  -> X0           face_x1_to_x0
#     FACE_X2  -> X0           face_x2_to_x0
#     FACE_X3  -> X0           face_x3_to_x0
#
#     X0       -> GAMEPLAY     x0_to_gameplay
#     FACE_X1  -> GAMEPLAY     face_x1_to_gameplay
#     FACE_X2  -> GAMEPLAY     face_x2_to_gameplay
#     FACE_X3  -> GAMEPLAY     face_x3_to_gameplay
#     GAMEPLAY -> X0           gameplay_to_x0
#     GAMEPLAY -> FACE_X1      gameplay_to_face_x1
#
# The ladder is climbed one rung at a time and never descended: there is no x0->x2, no x2->x1
# and no x3->x2. Coming out of gameplay lands at X0 or at FACE_X1 and nowhere tighter.
# Anything else is an error, not a silently ignored key.
#
# Only `x0_to_face_x1` and `face_x1_to_x0` are required. Omit a promotion role (from BOTH this
# table and [assets.transition_frames]) and the planner simply never makes that move — which
# is how a user who has not built a FACE_X3 asset stays on a two-level edit. The two tables
# must always list exactly the same roles.
#
# The six GAMEPLAY roles are optional in exactly the same way, and in Phase 9a they are read
# by the `gameplay-study` diagnostic ONLY: the production planner places none of them, and a
# config that omits them produces an identical facecam plan (D054).
#
# Names differ per user/edit style; the tool never inspects or rebuilds what these assets do
# internally. Note that in this bin the promotion clips are named after the state they LAND in
# (`FACE_X2` performs face_x1 -> face_x2) while the reset clips are named after the move.
[assets]
x0_to_face_x1 = "FACE_X1"
face_x1_to_face_x2 = "FACE_X2"
face_x2_to_face_x3 = "FACE_X3"
face_x1_to_x0 = "X1_TO_X0"
face_x2_to_x0 = "X2_TO_X0"
face_x3_to_x0 = "X3_TO_X0"
x0_to_gameplay = "X0_TO_GAMEPLAY"
face_x1_to_gameplay = "X1_TO_GAMEPLAY"
face_x2_to_gameplay = "X2_TO_GAMEPLAY"
face_x3_to_gameplay = "X3_TO_GAMEPLAY"
gameplay_to_x0 = "GAMEPLAY_TO_X0"
gameplay_to_face_x1 = "GAMEPLAY_TO_X1"

# How many frames each asset needs to finish its own animation. REQUIRED for planning, and
# deliberately without a default: these are your assets, and the tool never opens their Fusion
# graph to guess (see .agent/DECISIONS.md D007).
#
# This is NOT the clip's length in the Media Pool. `X1_TO_X0` is 42 frames long in this project
# and completes its move in 15, so a 15-frame instance does the whole job; the planner never
# uses the 42.
#
# The promotion assets work the other way round: `FACE_X1`, `FACE_X2` and `FACE_X3` animate in
# 15 frames and then simply *hold* the level they reached, so their instances are as long as
# the speech needs — 15 frames, 300, or more — with 15 only as the minimum below which the
# move would be truncated (D014, generalised to every promotion in D045).
#
# Frames, not milliseconds: the keyframes were authored on a frame grid.
[assets.transition_frames]
x0_to_face_x1 = 15
face_x1_to_face_x2 = 15
face_x2_to_face_x3 = 15
face_x1_to_x0 = 15
face_x2_to_x0 = 15
face_x3_to_x0 = 15
# Measured, not assumed (Phase 9a): each of these assets is 45 frames long in the Media Pool
# but animates over keyframes at t=0 and t=15, exactly like the facecam ones. That came from
# exporting the Fusion comps of the manual instances in DAZ_OUTPUT_MVP3 read-only — the
# runtime still never opens a Fusion graph (D007), and still never reads the 45.
x0_to_gameplay = 15
face_x1_to_gameplay = 15
face_x2_to_gameplay = 15
gameplay_to_x0 = 15
gameplay_to_face_x1 = 15
# NOT measured. `X3_TO_GAMEPLAY` has no manual instance anywhere in DAZ_OUTPUT_MVP3, so there
# was no comp to export and this 15 is inferred from the other five. Confirm it with the
# creator before Phase 9b places anything with it.
face_x3_to_gameplay = 15

[speech]
# Resolve exposes no API to read transcription data back (see .agent/HANDOFF.md), so the
# MVP uses an external voice-activity provider. Only "silero_vad" exists today; an SRT
# provider and a Whisper provider (for semantic rules) remain possible later.
provider = "silero_vad"

# ---------------------------------------------------------------------------------------
# TECHNICAL voice-activity detection parameters.
#
# These answer "did the creator actually make speech sounds here?" and nothing else. They
# are Silero VAD's own knobs and its official defaults; change them only when the detector
# is visibly wrong about the audio, never to make the resulting zooms look nicer. Editing
# taste lives in [planner] below.
# ---------------------------------------------------------------------------------------
[speech.vad]
# Speech probability above which a 32 ms window counts as speech.
threshold = 0.5

# Detected speech shorter than this is discarded as a blip (a click, a breath, a keystroke).
min_speech_ms = 250

# How long the model must stay quiet before an utterance is considered finished. This is
# phonetics, not editing: it stops a natural pause inside a sentence from splitting it in
# two. It is NOT "how long to wait before zooming out" — see reset_after_silence_ms.
min_silence_ms = 100

# Small technical padding so a segment does not clip the first/last phoneme. It is NOT the
# zoom's lead-in; a zoom that starts slightly before speech is an editorial choice.
speech_pad_ms = 30

# Exit threshold: while already in speech, windows below this end it. Leave unset for
# Silero's default of threshold - 0.15.
# neg_threshold = 0.35

# ---------------------------------------------------------------------------------------
# TECHNICAL voice-energy parameters (Phase 8c).
#
# How the loudness envelope that promotion cues are read from is BUILT — never what a
# measurement deserves, which is [planner] below. It is computed from the same normalized
# 16 kHz PCM the VAD consumes: one Resolve render, one ffmpeg pass, two readers.
#
# Changing any of these changes the plan, so they are part of the plan's recorded identity
# and a stale plan is refused (D051).
# ---------------------------------------------------------------------------------------
[speech.energy]
# Length of one RMS window. Long enough to average a pitch period, short enough that a
# syllable boundary is still visible.
window_ms = 30

# Distance between windows, and so the envelope's time resolution (0.6 frames at 60 fps).
hop_ms = 10

# Moving average over the dB curve: removes per-syllable jitter without moving a real onset.
smoothing_ms = 30

[planner]
# ---------------------------------------------------------------------------------------
# EDITORIAL timing — when a zoom should happen, as opposed to whether the creator was
# talking, which is [speech.vad] above.
# ---------------------------------------------------------------------------------------

# A GATE, not a delay. A silence shorter than this does not deserve a reset, so the two
# speech regions around it belong to the same editorial burst and the zoom simply stays up.
# A silence at least this long allows a reset — planned at the end of the burst, NOT 650 ms
# after it. The planner runs offline and already knows how long every pause will last.
reset_after_silence_ms = 650

# Optional anticipation around a burst. The MVP baseline is 0/0: the zoom starts exactly on
# the burst and the reset is placed exactly at its end. The old 80/120 ms defaults were
# scaffold guesses with no measurement behind them.
zoom_lead_in_ms = 0
zoom_lead_out_ms = 0

# When the creator stops talking and the edit cuts around the same moment, the reset looks
# better exactly ON that cut. The planner searches an ASYMMETRIC window around the reset
# anchor (burst end + lead-out) for hard cuts on [resolve].cut_reference_video_track, and
# takes the one CLOSEST to the anchor — not the last one — preferring the later cut on an
# exact tie. A candidate is only used if the whole reset_x0 animation still fits before the
# next zoom.
#
# Maximum search distance AFTER the detected end of speech.
cut_snap_window_ms = 350

# Small tolerance BEFORE the detected end of speech, used only to catch a real video cut that
# likely corresponds to the perceptual end of the phrase. The two settings are not symmetric
# and do not mean the same thing: the forward window follows the edit's own rhythm after a
# sentence, while this one compensates for the fact that a VAD boundary lands a few frames
# late — [speech.vad].speech_pad_ms deliberately pads the segment so no phoneme is clipped,
# and that padding must stay in the detector.
#
# It is ONLY a snap mechanism. It never moves a reset earlier on its own: with no hard cut in
# the window the reset stays exactly at the burst end. Keep it small — the point is not to
# start the reset noticeably before the phrase is over.
#
# 120 ms = 7 frames at 60 fps. Measured, not guessed: on the reference material every cut an
# editor aligned to sits 4-7 frames before the detected speech end, and the nearest unrelated
# cut is 30 frames away (see .agent/reports/phase-06-cut-offset-diagnostic.txt).
cut_snap_lookback_ms = 120

# There is no min_zoom_ms. The only minimum a transition instance has is its own animation
# length, from [assets.transition_frames] — an instance shorter than that is truncated
# mid-move (D014). The old 450 ms was an editorial assumption nobody measured.

# ---------------------------------------------------------------------------------------
# ZOOM-IN CUT SNAPPING (Phase 8c).
#
# The same idea as the reset window above, applied to every zoom-IN anchor: the entry
# (X0 -> FACE_X1) and each promotion. A zoom-in anchor has no systematic bias the way a VAD
# end does, so this window is SYMMETRIC and small.
#
# Measured on DAZ_OUTPUT_MVP2: four manual entries sit exactly on a hard cut, and in all four
# the detected burst start is 0-2 frames away — while the nearest NON-matching cut to any
# burst start is 62 frames away. 120 ms = 7 frames at 60 fps therefore catches every real one
# with an 8x margin to the first wrong one.
#
# A cut NEVER creates a transition. With no cut in the window the transition stays exactly on
# its audio anchor, and a cut that would break the chain (overlap the previous cycle, truncate
# an animation) is rejected in favour of the next valid candidate.
zoom_cut_snap_window_ms = 120
zoom_cut_snap_lookback_ms = 120

# ---------------------------------------------------------------------------------------
# FACECAM LEVEL PROMOTIONS (Phase 8c).
#
# SUPERSEDED: Phase 8 promoted on elapsed talking time
# (promote_to_face_x2_after_ms / min_remaining_after_face_x2_ms / ..._x3_ms). Those keys no
# longer exist and a config that still carries them is an ERROR, not a warning — see D049.
#
# A level is now earned by what the voice DOES inside the burst: it drops or breaks for a
# moment, then picks back up, and the tighter level starts on the pick-up. First qualifying
# recovery -> FACE_X2, second -> FACE_X3, anything after that is ignored.
#
# Every threshold is RELATIVE, in dB against the burst's own voice level (its 75th-percentile
# energy point), so changing microphone gain does not change the edit. Multiplying the whole
# file's amplitude by 4 or by 1/4 produces exactly the same plan; there is a test for it.

# How far under the burst's voice level the energy must fall to count as a dip at all.
# 20 dB is the middle of a broad plateau (19-21 dB all score identically on the reference
# edit) rather than a spike, which is why it is trustworthy on one timeline.
promotion_min_drop_db = 20

# How far back up the voice must come for the dip to be over: to within 6 dB of the same
# voice level. Deliberately insensitive — every value from 3 to 12 dB gives an identical plan
# on the reference material, because a real pick-up overshoots this line by a wide margin.
promotion_recovery_within_db = 6

# How long the energy must stay under the line. Below 30 ms a "dip" is a plosive or a glottal
# stop, not a break in the delivery.
promotion_min_valley_ms = 30

# Upper bound, and a guard rather than a tuned value: a burst cannot contain a silence longer
# than reset_after_silence_ms by construction, so on this material it never fires. It exists
# so that raising that gate cannot turn a genuine pause — which deserves a RESET — into a
# promotion. The longest qualifying valley measured is 270 ms.
promotion_max_valley_ms = 650

# How long the level a promotion opens must last, beyond its own animation. Measured: no
# manual promotion in DAZ_OUTPUT_MVP2 is held for fewer than 27 frames (450 ms), so 400 ms =
# 24 frames sits just below every hold the editor actually made, while still refusing a level
# that would flash for a few frames and read as a glitch.
#
# This is NOT Phase 8's `min_remaining_*`: it is measured from the promotion, not from the
# start of the burst, and it never decides WHETHER a level is deserved — only whether there is
# room to show it.
promotion_min_hold_ms = 400

[safety]
# Must remain true until the write milestone is explicitly implemented and validated.
dry_run = true
