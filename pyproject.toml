[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-auto-zoom"
version = "0.0.1"
description = "Speech-driven zoom automation for DaVinci Resolve gaming edits"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "davinci-auto-zoom contributors" }]
# Speech detection needs a tensor runtime and an array type; nothing else. `ffmpeg` is a
# system dependency (see README), not a Python one.
dependencies = [
  "numpy>=1.26",
  "onnxruntime>=1.17,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[project.scripts]
davinci-auto-zoom = "davinci_auto_zoom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The Silero VAD model ships inside the package: pinned, checksummed, and never downloaded
# at runtime. See src/davinci_auto_zoom/speech/models/PROVENANCE.md.
"davinci_auto_zoom.speech" = ["models/*.onnx", "models/*.txt", "models/*.md"]

[tool.pytest.ini_options]
# `tests/research/` covers `tools/research/`, which is research-only tooling that the shipped
# package never imports. It runs in the normal suite because it needs neither Resolve nor the
# network, and a research primitive without a test is as untrustworthy as a product one.
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# The runtime floor stays 3.11 (see requires-python). This is 3.12 only because numpy's
# bundled stubs use `type` statements, which mypy cannot parse at an earlier target.
python_version = "3.12"
strict = true
# The Phase 11a research tooling is held to the same strictness as the product, even though
# it ships with neither: research that type-checks is research whose numbers can be trusted.
files = ["src/davinci_auto_zoom", "tools/research"]
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
# onnxruntime ships no type information.
module = ["onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Phase 11a transcription script runs under its own isolated interpreter and these are
# deliberately NOT installed in the DAZ environment (see tools/research/phase11a/transcribe.py).
module = ["torch.*", "whisperx.*", "faster_whisper.*"]
ignore_missing_imports = true
