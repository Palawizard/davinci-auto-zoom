[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-auto-zoom"
version = "0.0.1"
description = "Speech-driven zoom automation for DaVinci Resolve gaming edits"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "davinci-auto-zoom contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[project.scripts]
davinci-auto-zoom = "davinci_auto_zoom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["davinci_auto_zoom"]
